# ==========================================
# MENTIS - Modulo Usuario (Spring Boot)
# ==========================================
spring.application.name=mentis-usuario
server.port=8080

# Lee variables desde un archivo .env en la raiz del proyecto (opcional)
spring.config.import=optional:file:.env[.properties]

# ------------------------------------------
# Base de datos MySQL (LA MISMA de Django)
# REGLA DE ORO: ddl-auto=none. Django es el dueño del esquema.
# ------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:mentis_db}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=utf8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ------------------------------------------
# Gemini (el modulo usuario llama directo a la API)
# ------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ------------------------------------------
# JWT propio del modulo usuario
# ------------------------------------------
jwt.secret=${JWT_SECRET:mentis-secreto-jwt-cambiar-en-produccion-2026!}

# ------------------------------------------
# Reglas del examen
# ------------------------------------------
mentis.examen.duracion-minutos=45
mentis.examen.total-preguntas=10
