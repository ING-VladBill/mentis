# ==========================================
# MENTIS - Modulo Usuario (Spring Boot)
# ==========================================
spring.application.name=mentis-usuario

# Puerto: usa el que Railway asigna ($PORT), o 8080 en local
server.port=${PORT:8080}

# Lee variables desde un archivo .env en la raiz (solo local; en Railway van como env vars)
spring.config.import=optional:file:.env[.properties]

# ------------------------------------------
# Base de datos MySQL (LA MISMA de Django)
# REGLA DE ORO: ddl-auto=none. Django es el dueño del esquema.
# DB_HOST y DB_PORT permiten apuntar a localhost (dev) o a Railway (prod)
# ------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mentis_db}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=utf8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ------------------------------------------
# Gemini (el modulo usuario llama directo a la API)
# ------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ------------------------------------------
# JWT propio del modulo usuario
# ------------------------------------------
jwt.secret=${JWT_SECRET}

# ------------------------------------------
# Reglas del examen
# ------------------------------------------
mentis.examen.duracion-minutos=45
mentis.examen.total-preguntas=10

# ------------------------------------------
# Comunicacion interna con Django (para el correo de avance a entrevista)
# En local: http://localhost:8000 . La clave debe coincidir con INTERNAL_SERVICE_KEY de Django.
# ------------------------------------------
django.base-url=${DJANGO_BASE_URL:http://localhost:8000}
django.internal-key=${INTERNAL_SERVICE_KEY:}